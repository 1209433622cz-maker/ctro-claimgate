   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="27.348661" y="41.951554" transform="rotate(-0 27.348661 41.951554)">a  Known-truth continuous simulation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(27.348661 60.422229)">49 virtual genes; K = 5 / 11 / 16 / 17</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(27.348661 73.172229)">Donor, cell and gene factors</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(27.348661 85.922229)">Direct signal: M1 only (K = 5)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="277.160315" y="41.951554" transform="rotate(-0 277.160315 41.951554)">b  Three distinct estimands</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(277.160315 60.422229)">Full donor target: all members</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(277.160315 73.172229)">Observed donor target: random subset</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(277.160315 85.922229)">Population cell target: cell-number weights</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="27.348661" y="148.119874" transform="rotate(-0 27.348661 148.119874)">c  Frozen main experiment</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(27.348661 166.590549)">A: calibration / coverage (128 scenarios)</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(27.348661 179.340549)">B: background attribution (32)</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(27.348661 192.413947)">C: informative cell numbers (32)</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(27.348661 204.840549)">192 × 5,000 paired instances</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="277.160315" y="148.119874" transform="rotate(-0 277.160315 148.119874)">d  Paired methods and evaluation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(277.160315 166.590549)">Cell-level vs equal-donor Welch</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(277.160315 179.340549)">Full-target 95% CI coverage</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(277.160315 192.090549)">Matching-target Type I / power / BH FDR</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(277.160315 204.840549)">Monte Carlo uncertainty; all scenarios</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="27.348661" y="264.241474" transform="rotate(-0 27.348661 264.241474)">e  Separate, previously observed PBC illustration</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(27.348661 282.712149)">4 controls + 4 PBC donors; derived logCPM-based scores</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(27.348661 295.462149)">Weighting and fixed-scale member deletion; all four maxT P = 1</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(27.348661 308.212149)">No new count reanalysis, disease truth or independent external validation</text>
   </g>
  </g>
 </g>
